<!-- Extension icon source: the Pinehurst tree-and-book mark, white on a blue app tile.
     icons/build-icons.ps1 draws the PNG sizes from the same shapes. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6fe4"/>
      <stop offset="1" stop-color="#0b3d91"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#tile)"/>
  <g transform="translate(13.4 17.5) scale(0.166)">
    <polygon points="80,120 300,165 530,120 530,540 330,500 300,505 80,540" fill="#fff" fill-opacity="0.4"/>
    <polygon points="107,147 300,188 503,147 503,512 330,478 300,482 107,512" fill="#0a2f73" fill-opacity="0.6"/>
    <polygon points="302,15 460,455 330,492 330,545 230,513 145,488" fill="#fff"/>
  </g>
</svg>
